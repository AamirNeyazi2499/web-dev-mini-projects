<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Carousel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="carousel-container">
        <div class="slides-container">
            <div class="slide active">
                <img src="https://picsum.photos/id/237/800/400" alt="Black dog">
            </div>
            <div class="slide">
                <img src="https://picsum.photos/id/238/800/400" alt="Foggy mountains">
            </div>
            <div class="slide">
                <img src="https://picsum.photos/id/239/800/400" alt="Dandelion">
            </div>
            <div class="slide">
                <img src="https://picsum.photos/id/240/800/400" alt="Cityscape">
            </div>
        </div>

        <button class="carousel-btn prev" id="prevBtn">&#10094;</button>
        <button class="carousel-btn next" id="nextBtn">&#10095;</button>

        <div class="dots-container" id="dots-container">
            </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
